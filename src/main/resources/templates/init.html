<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page(~{::div.content-wrapper})}">
<body>
<div class="container-fluid" th:fragment="content">

  <!-- Brand Voice Editor -->
  <div class="content-wrapper card" style="margin-bottom: 20px;">
    <h2>⚙️ Global System Constraints</h2>
    <p class="text-muted" style="margin-top: 0; color: #64748b;">Review and edit the global brand voice and strict rules applied to all AI agents.</p>

    <!-- Success message banner -->
    <div th:if="${successMessage}" style="background: #dcfce7; color: #16a34a; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-weight: bold;">
      <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/update-brand-voice}" method="post">
        <textarea name="brandVoiceContent" rows="12" th:text="${brandVoice}"
                  style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: monospace; font-size: 0.9em; background: #f8fafc;"></textarea>
      <button type="submit" style="background: #475569; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold;">
        💾 Save System Constraints
      </button>
    </form>
  </div>

  <div class="content-wrapper card">
    <h2> Step 1: Define Goal</h2>
    <form th:action="@{/start-campaign}" method="post">
      <label>What is your campaign objective?</label>
      <label>
        <input type="text" name="goal" placeholder="e.g. Launch a new eco-friendly coffee brand" required
               style="width: 100%; padding: 10px; margin: 10px 0;" />
      </label>
      <button type="submit"
              style="background: var(--primary); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        ✨ Create Your Strategic Plan</button>
    </form>
    </div>

  </div>
</body>
</html>
