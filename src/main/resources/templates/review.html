<!DOCTYPE html>
<!--
  AI-assisted development note:
  This template was initially generated with assistance from Google Gemini
  and subsequently reviewed, adapted, and integrated by the author.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: page(~{::div.content-wrapper})}">
<body>
<div class="content-wrapper card">
    <h2>Step 2: Customize Your Strategy</h2>
    <p>Review the AI's plan below. Make changes directly in the table before generating drafts.</p>

    <form id="campaignForm" th:action="@{/generate-drafts}" method="post">
        <textarea id="hiddenPlanJson" name="planJson" class="hidden" th:text="${planJson}"></textarea>
        <input type="hidden" name="campaignId" th:value="${campaignId}" th:if="${campaignId}" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="font-weight: bold; font-size: 0.9em; color: #64748b;">CAMPAIGN NAME</label>
                <input type="text" id="campaignName" th:value="${plan.campaignName}"
                       style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div>
                <label style="font-weight: bold; font-size: 0.9em; color: #64748b;">TARGET AUDIENCE</label>
                <input type="text" id="targetAudience" th:value="${plan.targetAudience}"
                       style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div style="grid-column: span 2;">
                <label style="font-weight: bold; font-size: 0.9em; color: #64748b;">MAIN GOAL</label>
                <input type="text" id="mainGoal" th:value="${plan.mainGoal}"
                       style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                <thead>
                <tr style="background: #f1f5f9; text-align: left;">
                    <th style="padding: 10px; border-bottom: 2px solid #e2e8f0;">Day</th>
                    <th style="padding: 10px; border-bottom: 2px solid #e2e8f0;">Platform</th>
                    <th style="padding: 10px; border-bottom: 2px solid #e2e8f0;">Stage</th>
                    <th style="padding: 10px; border-bottom: 2px solid #e2e8f0;">Pillar</th>
                    <th style="padding: 10px; border-bottom: 2px solid #e2e8f0;">Topic / Directive</th>
                </tr>
                </thead>
                <tbody id="scheduleBody">
                <tr th:each="post, iter : ${plan.schedule}" style="border-bottom: 1px solid #e2e8f0;">
                    <td style="padding: 10px;">
                        <span class="day-label" th:text="| ${post.dayNumber}|"></span>
                        <input type="hidden" class="post-day" th:value="${post.dayNumber}">
                    </td>
                    <td style="padding: 10px;">
                        <select class="post-platform" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                            <option th:each="plat : ${platforms}"
                                    th:value="${plat.name()}"
                                    th:text="${plat.getDisplayName()}"
                                    th:selected="${plat == post.platform}"></option>
                        </select>
                    </td>
                    <td style="padding: 10px;">
                        <select class="post-stage" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                            <option th:each="stage : ${funnelStages}"
                                    th:value="${stage.name()}"
                                    th:text="${stage.displayName}"
                                    th:selected="${stage == post.funnelStage}"></option>
                        </select>
                    </td>
                    <td style="padding: 10px;">
                        <select class="post-pillar" style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
                            <option th:each="pillar : ${contentPillars}"
                                    th:value="${pillar.name()}"
                                    th:text="${pillar.getDisplayName()}"
                                    th:selected="${pillar == post.contentPillar}"></option>
                        </select>
                    </td>
                    <td style="padding: 10px;"><input type="text" class="post-topic" th:value="${post.topicSummary}"
                                                      style="width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px;"></td>
                </tr>
                </tbody>
            </table>
        </div>


        <!-- GLASS-BOX TERMINAL (Hidden by default) -->
        <div id="telemetryTerminal" class="hidden" style="margin-top: 20px; background: #1e293b; color: #10b981; padding: 15px; border-radius: 8px; font-family: monospace; height: 200px; overflow-y: auto; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);">
            <div style="color: #94a3b8; margin-bottom: 10px; font-weight: bold;">[SYSTEM] Agent Telemetry Stream Initialized...</div>
            <div id="telemetryOutput"></div>
        </div>

        <div id="actionButtons" style="margin-top: 20px;">
            <button type="button" onclick="submitRefinedPlan()"
                    style="background: #16a34a; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                Approve & Generate Drafts
            </button>
            <a href="/" style="margin-left: 15px; color: #64748b; text-decoration: none;">Cancel</a>
        </div>
    </form>

    <script>
        async function submitRefinedPlan() {
            // 1. Hide buttons and show the terminal
            document.getElementById('actionButtons').classList.add('hidden');
            const terminal = document.getElementById('telemetryTerminal');
            terminal.classList.remove('hidden');
            const output = document.getElementById('telemetryOutput');
            const campaignId = document.querySelector('input[name="campaignId"]').value;

            // 2. Connect to the Server-Sent Events stream
            const eventSource = new EventSource('/api/telemetry/stream?campaignId=' + campaignId);

            eventSource.addEventListener('telemetry', function(event) {
                // LOOK FOR THE SIGNAL FROM THE BACKEND
                if (event.data === "GENERATION_COMPLETE") {
                    eventSource.close();
                    // ONLY redirect when the backend says it's done
                    window.location.href = '/view-drafts?campaignId=' + campaignId;
                    return;
                }
                const newLine = document.createElement('div');
                newLine.style.marginBottom = '5px';
                newLine.innerText = `> ${event.data}`;
                output.appendChild(newLine);
                // Auto-scroll to bottom
                terminal.scrollTop = terminal.scrollHeight;
            });

            // 3. Prepare the plan JSON
            const plan = {
                campaignName: document.getElementById('campaignName').value,
                targetAudience: document.getElementById('targetAudience').value,
                mainGoal: document.getElementById('mainGoal').value,
                schedule: []
            };

            document.querySelectorAll('#scheduleBody tr').forEach(row => {
                plan.schedule.push({
                    dayNumber: parseInt(row.querySelector('.post-day').value),
                    platform: row.querySelector('.post-platform').value,
                    funnelStage: row.querySelector('.post-stage').value,
                    contentPillar: row.querySelector('.post-pillar').value,
                    topicSummary: row.querySelector('.post-topic').value
                });
            });

            // 4. Send the generation command asynchronously
            const formData = new URLSearchParams();
            formData.append('campaignId', campaignId);
            formData.append('planJson', JSON.stringify(plan));

            try {
                const response = await fetch('/generate-drafts', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: formData
                });

                if (!response.ok && !response.redirected) {
                    const err = await response.json();
                    output.innerHTML += `<div style="color: #ef4444; margin-top: 10px;">> CRITICAL ERROR: ${err.error}</div>`;
                    eventSource.close();
                }
            } catch (e) {
                output.innerHTML += `<div style="color: #ef4444; margin-top: 10px;">> NETWORK ERROR: Failed to connect to orchestrator.</div>`;
                eventSource.close();
            }
        }
    </script>
</div>
</body>
</html>
